<dialog id="data"><div class="dh"><h2>App 資料</h2><button class="btn" onclick="data.close()">關閉</button></div><div class="body"><div class="box"><h3>名稱／代號</h3><div class="nameRow"><input id="name" maxlength="20"><button id="saveName" class="btn primary">儲存</button></div></div><div class="box"><h3>自訂計數項目</h3><div class="customNameItem"><input id="custom1Name" maxlength="20" placeholder="自訂項目 1"><button id="saveCustom1" class="btn primary">儲存</button></div><div class="customNameItem"><input id="custom2Name" maxlength="20" placeholder="自訂項目 2"><button id="saveCustom2" class="btn primary">儲存</button></div></div><div class="box"><h3>備份與還原</h3><div class="dataRow"><button id="export" class="btn primary">匯出備份</button><button id="import" class="btn">匯入備份</button></div><input id="file" type="file" accept="application/json,.json" hidden></div></div></dialog><div id="toast" class="toast"></div>
<script>
const BASE=[['preach','傳講',''],['pray','禱告','pray'],['names','名單','names'],['revisit','回訪','revisit'],['custom1','','custom1'],['custom2','','custom2']],DB='outing-counter-app',ST='days',SS='settings',NK='outing-counter-display-name',C1K='outing-counter-custom1-name',C2K='outing-counter-custom2-name';let customNames={custom1:'',custom2:''},db,today,last=null,displayName='',slide=0;const SLIDES=Array.from({length:10},(_,i)=>'assets/mystery-'+String(i+1).padStart(2,'0')+'.jpg');const K=()=>BASE.map(x=>[x[0],x[0]==='custom1'?customNames.custom1:(x[0]==='custom2'?customNames.custom2:x[1]),x[2]]);const dk=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,blank=()=>Object.fromEntries(K().map(x=>[x[0],0])),norm=c=>Object.fromEntries(K().map(x=>[x[0],Math.max(0,Math.floor(Number(c?.[x[0]])||0))]));
function odb(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(ST))r.result.createObjectStore(ST,{keyPath:'date'});if(!r.result.objectStoreNames.contains(SS))r.result.createObjectStore(SS,{keyPath:'key'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function os(m='readonly'){return db.transaction(ST,m).objectStore(ST)}function ss(m='readonly'){return db.transaction(SS,m).objectStore(SS)}function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function get(k){return await req(os().get(k))||null}async function all(){return await req(os().getAll())||[]}async function put(v){await req(os('readwrite').put(v))}async function del(k){await req(os('readwrite').delete(k))}async function gs(k){let r=await req(ss().get(k));return r?.value??null}async function ps(k,v){await req(ss('readwrite').put({key:k,value:v}))}
async function ensure(){let k=dk(),d=await get(k);if(!d){d={date:k,counts:blank(),updatedAt:Date.now()};await put(d)}else{d.counts=norm(d.counts)}today=d;let a=(await all()).sort((a,b)=>b.date.localeCompare(a.date));for(let x of a.slice(15))await del(x.date)}
async function loadSettings(){displayName=((await gs('displayName'))||localStorage.getItem(NK)||'').slice(0,20);for(const [id,key,lk] of [['custom1','custom1Name',C1K],['custom2','custom2Name',C2K]])customNames[id]=((await gs(key))||localStorage.getItem(lk)||'').slice(0,20)}
async function saveSetting(key,lk,v){v=(v||'').trim().slice(0,20);await ps(key,v);try{localStorage.setItem(lk,v)}catch{}return v}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v+'View').classList.add('active');document.body.classList.toggle('counterActive',v==='counter');if(v==='home')renderSummary();window.scrollTo(0,0)}
function render(){who.textContent=displayName?'使用者：'+displayName:'未設定名稱';who.classList.toggle('unset',!displayName);date.textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());homeDate.textContent=date.textContent;grid.innerHTML=K().map(([id,l,c])=>`<article class="card ${c}"><div class="label">${l||'　'}</div><div id="v-${id}" class="num">${today?.counts?.[id]||0}</div><div class="acts"><button class="minus" data-id="${id}" data-d="-1">−</button><button class="plus" data-id="${id}" data-d="1">＋</button></div></article>`).join('');undo.disabled=!last;renderSummary()}
function renderSummary(){if(!today)return;summaryGrid.innerHTML=BASE.slice(0,4).map(([id,l])=>`<div class="sum"><b>${today.counts[id]||0}</b><span>${l}</span></div>`).join('')}
function stamp(){saved.textContent='最後儲存 '+new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}async function change(id,d){await ensure();let b=today.counts[id]||0,a=Math.max(0,b+d);if(a===b)return;last={date:today.date,id,b};today.counts[id]=a;today.updatedAt=Date.now();await put(today);let el=document.getElementById('v-'+id);if(el)el.textContent=a;undo.disabled=false;stamp();renderSummary()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(b)change(b.dataset.id,+b.dataset.d)});undo.onclick=async()=>{if(!last)return;await ensure();if(last.date===today.date){today.counts[last.id]=last.b;await put(today)}last=null;render();stamp()};
function openMystery(){slide=0;renderSlide();go('mystery')}function renderSlide(){slideImg.src=SLIDES[slide];pageNo.textContent=`${slide+1} / 10`;prevSlide.disabled=slide===0;nextSlide.disabled=slide===9}prevSlide.onclick=()=>{if(slide>0){slide--;renderSlide()}};nextSlide.onclick=()=>{if(slide<9){slide++;renderSlide()}};finishSlide.onclick=finishTop.onclick=()=>finishDialog.showModal();finishOnly.onclick=()=>{finishDialog.close();go('home')};finishAndCount.onclick=async()=>{await change('preach',1);finishDialog.close();go('home')};
histBtn.onclick=async()=>{let a=(await all()).filter(x=>x.date!==today.date).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);histList.innerHTML=a.length?a.map(d=>`<div class="day"><b>${d.date}</b><div class="stats">${K().map(([id,l])=>`<div class="st"><b>${d.counts[id]||0}</b><span>${l||'未命名'}</span></div>`).join('')}</div></div>`).join(''):'<div class="box">尚無過去記錄</div>';hist.showModal()};dataBtn.onclick=()=>{name.value=displayName;custom1Name.value=customNames.custom1;custom2Name.value=customNames.custom2;data.showModal()};saveName.onclick=async()=>{displayName=await saveSetting('displayName',NK,name.value);render();toastMsg('名稱已儲存')};saveCustom1.onclick=async()=>{customNames.custom1=await saveSetting('custom1Name',C1K,custom1Name.value);render();toastMsg('已儲存')};saveCustom2.onclick=async()=>{customNames.custom2=await saveSetting('custom2Name',C2K,custom2Name.value);render();toastMsg('已儲存')};
export.onclick=async()=>{let payload={app:'外出計數',version:5,displayName,customNames:{...customNames},days:await all()},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`外出計數備份-${dk()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};import.onclick=()=>file.click();file.onchange=async()=>{try{let o=JSON.parse(await file.files[0].text());if(!Array.isArray(o.days))throw 0;if(typeof o.displayName==='string')displayName=await saveSetting('displayName',NK,o.displayName);if(o.customNames){customNames.custom1=await saveSetting('custom1Name',C1K,o.customNames.custom1||'');customNames.custom2=await saveSetting('custom2Name',C2K,o.customNames.custom2||'')}for(let d of o.days)if(/^\d{4}-\d{2}-\d{2}$/.test(d.date))await put({date:d.date,counts:norm(d.counts),updatedAt:Date.now()});await ensure();render();toastMsg('備份已還原')}catch{toastMsg('備份檔無效')}file.value=''};function toastMsg(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
async function init(){db=await odb();await loadSettings();await ensure();render();stamp();navigator.storage?.persist?.();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}setInterval(async()=>{if(!db)return;let old=today.date;await ensure();if(old!==today.date){last=null;render();stamp()}},30000);init();
</script></body></html>
